<style>
/* ─── Reset & variables ─── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --bg:#070E0B;
  --surf:#0C1913;
  --card:#112018;
  --border:#1B3224;
  --text:#DCEDE4;
  --muted:#527A62;
  --dim:#2A4838;
  --accent:#22C35E;
  --font:'Trebuchet MS','DejaVu Sans',system-ui,sans-serif;
}

html{font-size:16px}
body{
  min-height:100vh;min-height:100dvh;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{cursor:pointer;font-family:var(--font)}

/* ─── Accent stripe ─── */
#stripe{
  position:fixed;top:0;left:0;right:0;
  height:2px;
  background:var(--accent);
  transition:background .45s ease;
  z-index:10;
}

/* ─── App shell ─── */
#app{
  max-width:440px;
  min-height:100vh;min-height:100dvh;
  margin:0 auto;
  padding:36px 22px 56px;
  display:flex;flex-direction:column;
}

/* ─── Brand ─── */
.brand{
  display:flex;align-items:center;gap:11px;
  margin-bottom:38px;
}
.brand-mark{
  width:34px;height:34px;
  background:var(--accent);
  border-radius:9px;
  display:flex;align-items:center;justify-content:center;
  font-size:19px;font-weight:700;
  color:#050C08;
  font-family:Georgia,'Times New Roman',serif;
  flex-shrink:0;
  transition:background .45s ease;
  user-select:none;
}
.brand-name{font-size:17px;font-weight:700;letter-spacing:.01em;line-height:1.2}
.brand-sub{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;line-height:1.2}

/* ─── Progress dots ─── */
.prog{display:flex;align-items:center;gap:5px;margin-bottom:30px}
.dot{height:6px;border-radius:3px;background:var(--dim);transition:all .25s ease}
.dot{width:6px}
.dot.done{width:18px;background:var(--muted);opacity:.55}
.dot.active{width:26px;background:var(--accent)}

/* ─── Question ─── */
.q-meta{
  font-size:11px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin-bottom:11px;
}
.q-text{
  font-size:21px;font-weight:700;line-height:1.35;
  color:var(--text);margin-bottom:26px;
  text-wrap:balance;
}

/* ─── Option cards ─── */
.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  position:relative;overflow:hidden;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:11px;
  padding:15px 18px;
  text-align:left;color:var(--text);
  font-size:15px;line-height:1.4;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  transition:border-color .15s,background .15s,transform .1s;
  -webkit-tap-highlight-color:transparent;
}
.opt::before{
  content:'';
  position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--accent);
  transform:scaleX(0);transform-origin:left;
  transition:transform .15s ease;
}
.opt:hover{border-color:var(--accent);background:#162E22}
.opt:hover::before{transform:scaleX(1)}
.opt:active{transform:scale(.97);background:#1A3628}
.opt-label{flex:1}
.opt-chev{
  flex-shrink:0;width:22px;height:22px;
  border-radius:50%;border:1.5px solid var(--dim);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;color:var(--dim);
  transition:all .15s;
}
.opt:hover .opt-chev{border-color:var(--accent);color:var(--accent)}

/* ─── Back button ─── */
.back-btn{
  background:none;border:none;
  color:var(--muted);font-size:14px;padding:0;
  margin-top:22px;display:flex;align-items:center;gap:5px;
  transition:color .15s;
}
.back-btn:hover{color:var(--text)}

/* ─── Result screen ─── */
.result-scr{animation:fadeUp .28s ease}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

.fit-badge{
  display:inline-flex;align-items:center;gap:7px;
  padding:4px 13px 4px 8px;
  border-radius:20px;
  font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--accent);
  margin-bottom:14px;
}
.fit-dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}

.result-name{
  font-size:25px;font-weight:700;line-height:1.25;
  color:var(--accent);margin-bottom:14px;
  transition:color .45s;
}
.result-reason{
  font-size:14px;color:var(--muted);line-height:1.65;
  margin-bottom:30px;
  padding-left:14px;
  border-left-width:2px;border-left-style:solid;
}

/* ─── Result sections ─── */
.rs{margin-bottom:26px}
.rs-lbl{
  font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--muted);margin-bottom:11px;
}
.uc-list{display:flex;flex-direction:column;gap:8px}
.uc{display:flex;align-items:flex-start;gap:10px;font-size:14px;line-height:1.5;color:var(--text)}
.uc-dot{flex-shrink:0;width:5px;height:5px;border-radius:50%;background:var(--accent);margin-top:8px;transition:background .45s}

.impact-box{
  background:var(--card);border:1px solid var(--border);
  border-left-width:3px;border-left-style:solid;
  border-radius:10px;
  padding:14px 16px;
  font-size:14px;line-height:1.6;color:var(--text);
}

.runner-box{
  background:var(--surf);border:1px solid var(--border);
  border-radius:10px;padding:14px 16px;
}
.runner-name{font-size:13px;font-weight:700;color:var(--text);margin-bottom:5px}
.runner-text{font-size:13px;color:var(--muted);line-height:1.55}

/* ─── CTA ─── */
.cta{margin-top:28px;border-top:1px solid var(--border);padding-top:26px}
.cta-title{font-size:16px;font-weight:700;margin-bottom:6px}
.cta-sub{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:18px}

.ph-field{
  width:100%;
  background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:13px 16px;
  color:var(--text);font-family:var(--font);font-size:14px;
  outline:none;margin-bottom:10px;
  transition:border-color .15s;
  display:block;
}
.ph-field::placeholder{color:var(--dim)}
.ph-field:focus{border-color:var(--accent)}

.wa-btn{
  width:100%;background:var(--accent);border:none;
  border-radius:10px;padding:15px 20px;
  color:#040B07;font-family:var(--font);font-size:15px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:9px;
  transition:opacity .15s,transform .1s;
  margin-bottom:9px;
}
.wa-btn:hover{opacity:.87}
.wa-btn:active{transform:scale(.98)}

.reset-btn{
  width:100%;background:none;
  border:1px solid var(--border);border-radius:10px;
  padding:12px;color:var(--muted);
  font-family:var(--font);font-size:14px;
  transition:border-color .15s,color .15s;
}
.reset-btn:hover{border-color:var(--dim);color:var(--text)}

/* ─── Honest-fit ─── */
.honest-title{font-size:21px;font-weight:700;line-height:1.35;color:var(--text);margin-bottom:12px}
.honest-body{font-size:14px;color:var(--muted);line-height:1.65;margin-bottom:24px}

.threshold-card{
  background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:16px;
  margin-bottom:24px;
  display:flex;align-items:center;gap:14px;
}
.threshold-num{
  font-size:32px;font-weight:700;color:var(--accent);
  line-height:1;flex-shrink:0;transition:color .45s;
}
.threshold-sub{font-size:13px;color:var(--muted);line-height:1.45}

/* ─── Transitions ─── */
.screen{animation:fadeUp .22s ease}

@media(prefers-reduced-motion:reduce){
  .screen,.result-scr{animation:none}
  *,*::before,*::after{transition-duration:.01ms!important}
}

@media(min-width:600px){
  #app{padding-top:52px}
}
</style>

    3:"At this volume, automated bookings and reminder sequences recover the equivalent of 1–2 lost slots per day — directly to your bottom line."
  }
};

var RUNNER_TRIGGER = {
  'support→sales':        "The AI Sales Bot is the natural next step. Add it when lead volume grows faster than your team can qualify them — usually around the 300/month mark.",
  'support→lifecycle':    "Once support is on autopilot, the Lifecycle Bot turns one-time buyers into repeat customers. Most businesses add it within 3–6 months.",
  'support→appointments': "If you take bookings of any kind, the Appointment Bot handles them end-to-end — so your support queue stays clean and every slot gets filled.",
  'sales→support':        "As lead volume grows, so does the support queue. Add the Conversational Support Bot when your team starts spending more than an hour a day on repeat questions.",
  'sales→lifecycle':      "After the top of the funnel is working, the Lifecycle Bot keeps those customers coming back. Most add it 3–6 months after launching the Sales Bot.",
  'sales→appointments':   "Once leads are coming in, the Appointment Bot removes the biggest drop-off point — the scheduling back-and-forth. Add it to convert more of those leads into confirmed bookings.",
  'lifecycle→support':    "Customer questions scale with your customer base. Add the Conversational Support Bot when repeat queries start eating into your team's time.",
  'lifecycle→sales':      "Good retention is half the equation. The AI Sales Bot handles new-customer acquisition. Add it once you're confident the onboarding flow is solid.",
  'lifecycle→appointments':"For retention to work, the next booking has to be easy. The Appointment Bot makes re-booking frictionless — so clients come back before they drift away.",
  'appointments→support': "As your booking volume grows, so do pre- and post-appointment questions. The Conversational Support Bot handles them automatically.",
  'appointments→sales':   "Once bookings are flowing, the AI Sales Bot captures and converts the leads that haven't booked yet. Add it to fill the gaps in your calendar proactively.",
  'appointments→lifecycle':"Consistent bookings are built on repeat visits. The Lifecycle Bot re-engages clients between appointments and turns occasional visitors into regulars."
};

/* ──────────────────────────────────
   STATE
   ────────────────────────────────── */
var step     = 0;
var scr      = 'quiz';
var scores   = {support:0, sales:0, lifecycle:0, appointments:0};
var contribs = [];

/* ──────────────────────────────────
   LOGIC
   ────────────────────────────────── */
function selectOpt(q, i) {
  var opt = Q[q].opts[i];
  var contrib = {};
  (opt.sc||[]).forEach(function(sp){ scores[sp[0]] += sp[1]; contrib[sp[0]] = (contrib[sp[0]]||0) + sp[1]; });
  contribs[q] = {i:i, c:contrib};
  if (opt.honest) { scr='honest'; render(); return; }
  if (q === Q.length-1) { scr='result'; render(); return; }
  step = q+1; render();
}

function goBack() {
  if (scr==='honest')  { undoStep(3);          step=3;          scr='quiz'; render(); return; }
  if (scr==='result')  { undoStep(Q.length-1); step=Q.length-1; scr='quiz'; render(); return; }
  if (step===0) return;
  undoStep(step-1); step--; render();
}

function undoStep(idx) {
  if (!contribs[idx]) return;
  Object.keys(contribs[idx].c).forEach(function(p){ scores[p] -= contribs[idx].c[p]; });
  contribs[idx] = null;
}

function resetQuiz() {
  step=0; scr='quiz';
  scores={support:0, sales:0, lifecycle:0, appointments:0};
  contribs=[];
  setAccent('support'); render();
}

function winner() {
  return ['support','sales','lifecycle','appointments'].reduce(function(b,p){ return scores[p]>scores[b]?p:b; },'support');
}
function runnerUp(w) {
  var o = ['support','sales','lifecycle','appointments'].filter(function(p){return p!==w;});
  return o.reduce(function(b,p){ return scores[p]>scores[b]?p:b; }, o[0]);
}
function q1i()  { return contribs[0] ? contribs[0].i : 0; }
function voli() { return contribs[3] ? contribs[3].i : 1; }

function openDemo(id) {
  var phone = ((document.getElementById(id)||{}).value||'').trim().replace(/\D/g,'');
  var msg = phone
    ? 'Hi, I went through the Alphabot Bot Advisor quiz. Please start the demo for me — my number is +'+phone
    : "Hi, I'd like to see the Alphabot demo";
  window.open('https://wa.me/'+DEMO+'?text='+encodeURIComponent(msg),'_blank');
}

function setAccent(p) {
  var c = ACCENTS[p]||ACCENTS.support;
  document.documentElement.style.setProperty('--accent', c);
  var bm = document.getElementById('bmark');
  if (bm) bm.style.background = c;
  var stripe = document.getElementById('stripe');
  if (stripe) stripe.style.background = c;
}

function rgba(hex, a) {
  var r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}

/* ──────────────────────────────────
   RENDER
   ────────────────────────────────── */
function render() {
  var el = document.getElementById('screen');
  if (!el) return;
  if (scr==='quiz')   { setAccent('support'); renderQuiz(el); }
  else if (scr==='honest') { setAccent('support'); renderHonest(el); }
  else { var w=winner(); setAccent(w); renderResult(el,w); }
}

function makeDots(cur, total, allDone) {
  var h='<div class="prog">';
  for (var i=0;i<total;i++) {
    var c = allDone ? 'dot done' : (i<cur ? 'dot done' : (i===cur ? 'dot active' : 'dot'));
    h += '<span class="'+c+'"></span>';
  }
  return h+'</div>';
}

function renderQuiz(el) {
  var q = Q[step];
  var opts = q.opts.map(function(o,i){
    return '<button class="opt" onclick="selectOpt('+step+','+i+')" type="button">'
          +'<span class="opt-label">'+o.lbl+'</span>'
          +'<span class="opt-chev">›</span></button>';
  }).join('');
  var back = step>0 ? '<button class="back-btn" onclick="goBack()" type="button">← Back</button>' : '';
  el.innerHTML = '<div class="screen">'
    +makeDots(step, Q.length, false)
    +'<p class="q-meta">Question '+(step+1)+' of '+Q.length+' · '+q.meta+'</p>'
    +'<h2 class="q-text">'+q.text+'</h2>'
    +'<div class="opts">'+opts+'</div>'
    +back+'</div>';
}

function renderResult(el, w) {
  var r    = runnerUp(w);
  var qi   = q1i();
  var vi   = voli();
  var ac   = ACCENTS[w];
  var reason  = (REASON[w]  && REASON[w][qi])  || REASON[w][0];
  var cases   = (USE_CASES[w] && USE_CASES[w][qi]) || USE_CASES[w][0];
  var impact  = (IMPACT[w]  && IMPACT[w][vi])  || IMPACT[w][1];
  var trigger = RUNNER_TRIGGER[w+'→'+r] || '';

  var ucHtml = cases.map(function(c){
    return '<div class="uc"><span class="uc-dot"></span><span>'+c+'</span></div>';
  }).join('');

  el.innerHTML = '<div class="screen result-scr">'
    +makeDots(0, Q.length, true)

    +'<div class="fit-badge" style="background:'+rgba(ac,.1)+';border:1px solid '+rgba(ac,.28)+';">'
    +'<span class="fit-dot" style="background:'+ac+'"></span>Your fit</div>'

    +'<div class="result-name" style="color:'+ac+'">'+PNAME[w]+'</div>'
    +'<div class="result-reason" style="border-left-color:'+rgba(ac,.38)+'">'+reason+'</div>'

    +'<div class="rs"><div class="rs-lbl">What it handles for you</div>'
    +'<div class="uc-list">'+ucHtml+'</div></div>'

    +'<div class="rs"><div class="rs-lbl">Realistic impact at your volume</div>'
    +'<div class="impact-box" style="border-left-color:'+ac+'">'+impact+'</div></div>'

    +'<div class="rs"><div class="rs-lbl">Add next</div>'
    +'<div class="runner-box"><div class="runner-name">'+PNAME[r]+'</div>'
    +'<div class="runner-text">'+trigger+'</div></div></div>'

    +'<div class="cta">'
    +'<div class="cta-title">See it live</div>'
    +'<div class="cta-sub">Message the demo bot — or leave your number and we\'ll start the conversation your side.</div>'
    +'<input class="ph-field" id="ph-r" type="tel" placeholder="Your WhatsApp number (optional)" />'
    +'<button class="wa-btn" style="background:'+ac+'" onclick="openDemo(\'ph-r\')" type="button">'
    +waIcon()+'Message the demo bot</button>'
    +'<button class="reset-btn" onclick="resetQuiz()" type="button">← Start over</button>'
    +'</div>'

    +'<button class="back-btn" onclick="goBack()" type="button" style="margin-top:20px">← Back</button>'
    +'</div>';
}

function renderHonest(el) {
  var ac = ACCENTS.support;
  el.innerHTML = '<div class="screen result-scr">'
    +makeDots(0, Q.length, true)

    +'<h2 class="honest-title">A bot won\'t pay for itself yet — and we\'d rather tell you that.</h2>'
    +'<p class="honest-body">For fewer than 100 enquiries a month, you\'d spend more setting up a bot than you\'d save in the first few months. That\'s not where we want to start a relationship.</p>'

    +'<div class="threshold-card">'
    +'<div class="threshold-num" style="color:'+ac+'">~150</div>'
    +'<div class="threshold-sub">enquiries a month is roughly where a WhatsApp bot starts to pay for itself — the hours saved become real and consistent.</div>'
    +'</div>'

    +'<p class="honest-body">If you\'re building toward that number, seeing the platform now makes sense. You\'ll know exactly what to set up when you\'re ready.</p>'

    +'<div class="cta" style="border-top:none;padding-top:0;margin-top:0">'
    +'<div class="cta-title">See the demo anyway</div>'
    +'<div class="cta-sub">No pressure. Explore what\'s possible before you need it.</div>'
    +'<input class="ph-field" id="ph-h" type="tel" placeholder="Your WhatsApp number (optional)" />'
    +'<button class="wa-btn" style="background:'+ac+'" onclick="openDemo(\'ph-h\')" type="button">'
    +waIcon()+'Message the demo bot</button>'
    +'<button class="reset-btn" onclick="resetQuiz()" type="button">← Start over</button>'
    +'</div>'

    +'<button class="back-btn" onclick="goBack()" type="button" style="margin-top:20px">← Back</button>'
    +'</div>';
}

function waIcon() {
  return '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="flex-shrink:0">'
    +'<path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>'
    +'</svg>';
}

/* ──────────────────────────────────
   INIT
   ────────────────────────────────── */
render();
</script>
