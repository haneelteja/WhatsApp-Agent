<title>Alphabot ROI Builder</title>
<style>
:root{
  --bg:#090E09;--surface:#0F150F;--card:#141E14;--border:#1A2A1A;
  --accent:#22C35E;--accent2:#15803D;--gold:#D4A843;--red:#D04040;
  --text:#E6F0E6;--text2:#9AAA9A;--muted:#5A6A5A;
  --r:14px;--rr:8px;font-size:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Trebuchet MS',sans-serif;min-height:100vh;padding:0}
#app{min-height:100vh;display:flex;flex-direction:column}
.shell{max-width:520px;margin:0 auto;width:100%;padding:20px 16px 80px;flex:1}

/* progress */
.prog{display:flex;gap:6px;margin-bottom:28px;padding-top:8px}
.prog-dot{height:3px;flex:1;background:var(--border);border-radius:2px;transition:background .3s}
.prog-dot.done{background:var(--accent)}
.prog-dot.active{background:var(--accent);opacity:.5}

/* logo */
.logo{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);opacity:.8;margin-bottom:4px}

/* headings */
h1{font-size:26px;font-weight:700;line-height:1.2;color:var(--text);margin-bottom:8px}
h2{font-size:20px;font-weight:700;color:var(--text);margin-bottom:6px}
.sub{color:var(--text2);font-size:15px;line-height:1.5;margin-bottom:24px}

/* option cards */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:14px 16px;cursor:pointer;transition:border-color .2s,background .2s;display:flex;align-items:center;gap:12px;-webkit-tap-highlight-color:transparent}
.opt:active,.opt:hover{border-color:var(--accent2);background:#172617}
.opt.sel{border-color:var(--accent);background:#162616}
.opt-icon{font-size:22px;width:32px;text-align:center;flex-shrink:0}
.opt-body{flex:1}
.opt-label{font-size:15px;font-weight:600;color:var(--text)}
.opt-desc{font-size:13px;color:var(--text2);margin-top:2px}
.opt-check{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--muted);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.2s}
.opt.sel .opt-check{background:var(--accent);border-color:var(--accent)}
.opt-check-inner{width:8px;height:8px;border-radius:50%;background:var(--bg);display:none}
.opt.sel .opt-check-inner{display:block}

/* primary badge */
.badge{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:20px;border:1px solid var(--border);color:var(--text2);cursor:pointer;transition:.2s;white-space:nowrap}
.badge.primary{background:var(--accent);border-color:var(--accent);color:var(--bg)}

/* 2-col grid for segment screen */
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt-grid .opt{flex-direction:column;align-items:flex-start;padding:14px}
.opt-grid .opt-icon{margin-bottom:4px}

/* buttons */
.btn{width:100%;padding:16px;border:none;border-radius:var(--r);font-family:inherit;font-size:16px;font-weight:700;cursor:pointer;transition:.2s;-webkit-tap-highlight-color:transparent}
.btn-primary{background:var(--accent);color:var(--bg)}
.btn-primary:hover{background:#2DD46A}
.btn-secondary{background:var(--card);color:var(--text);border:1.5px solid var(--border)}
.btn-ghost{background:transparent;color:var(--text2);font-size:14px}
.btn:disabled{opacity:.4;cursor:default}
.nav-row{display:flex;gap:10px;margin-top:24px}
.nav-row .btn-ghost{flex:0 0 auto;width:auto;padding:14px 20px}

/* inputs */
.form-group{margin-bottom:16px}
label{display:block;font-size:13px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.label-row{display:flex;justify-content:space-between;align-items:baseline}
.label-src{font-size:11px;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0;font-style:italic}
input[type=number],select{width:100%;background:var(--card);border:1.5px solid var(--border);border-radius:var(--rr);color:var(--text);font-family:inherit;font-size:16px;padding:12px 14px;-webkit-appearance:none;appearance:none;transition:border-color .2s}
input[type=number]:focus,select:focus{outline:none;border-color:var(--accent2)}
.input-prefix{position:relative}
.input-prefix span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text2);font-size:15px;pointer-events:none}
.input-prefix input{padding-left:28px}
.hint{font-size:12px;color:var(--muted);margin-top:5px}
.rt-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.rt-opt{background:var(--card);border:1.5px solid var(--border);border-radius:var(--rr);padding:10px 12px;cursor:pointer;transition:.2s;text-align:center;font-size:13px;color:var(--text2)}
.rt-opt.sel{border-color:var(--accent);color:var(--text);background:#162616}
.section-hdr{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:24px 0 12px}

/* results */
.result-hero{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px;margin-bottom:16px}
.result-hero-label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text2);margin-bottom:4px}
.result-hero-val{font-size:40px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1}
.result-hero-sub{font-size:14px;color:var(--text2);margin-top:4px}

.scenario-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:20px}
.scenario{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:12px}
.scenario.cons{border-color:var(--accent2)}
.scenario-name{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text2);margin-bottom:4px}
.scenario.cons .scenario-name{color:var(--accent)}
.scenario-val{font-size:22px;font-weight:700;color:var(--text);font-variant-numeric:tabular-nums}
.scenario.cons .scenario-val{color:var(--accent)}
.scenario-sub{font-size:11px;color:var(--muted);margin-top:2px}

.streams{margin-bottom:20px}
.stream{border-bottom:1px solid var(--border);padding:14px 0}
.stream:last-child{border-bottom:none}
.stream-row{display:flex;justify-content:space-between;align-items:center}
.stream-name{font-size:14px;font-weight:600;color:var(--text)}
.stream-val{font-size:15px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.stream-na{font-size:13px;color:var(--muted);font-style:italic}
.stream-math{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6;display:none;background:var(--surface);border-radius:var(--rr);padding:10px;font-family:monospace}
.stream-math.open{display:block}
.show-math{font-size:12px;color:var(--text2);cursor:pointer;margin-top:5px;text-decoration:underline;background:none;border:none;color:var(--text2);padding:0;font-family:inherit}

.uc-section{margin-bottom:20px}
.uc-hdr{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:6px;margin-bottom:8px}
.uc-hdr.bot{background:#0A1E12;color:var(--accent)}
.uc-hdr.confirm{background:#1A1A0A;color:var(--gold)}
.uc-hdr.escalate{background:#1A0A0A;color:#E08060}
.uc-item{font-size:14px;color:var(--text2);padding:8px 0;border-bottom:1px solid var(--border);line-height:1.5}
.uc-item:last-child{border-bottom:none}

.close-card{background:var(--card);border:1.5px solid var(--accent2);border-radius:var(--r);padding:20px;margin-bottom:16px}
.close-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.close-line{font-size:17px;font-weight:700;color:var(--text);line-height:1.4;margin-bottom:12px}
.close-plan{font-size:14px;color:var(--text2)}
.close-plan strong{color:var(--text)}

.payback-warn{background:#1A0E0A;border:1px solid var(--red);border-radius:var(--rr);padding:12px 14px;font-size:13px;color:#E09070;margin-bottom:16px;line-height:1.5}
.lowvol-warn{background:#141820;border:1px solid #2A3A5A;border-radius:var(--rr);padding:16px;font-size:14px;color:var(--text2);margin-bottom:16px;line-height:1.6}

.divider{height:1px;background:var(--border);margin:20px 0}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:20px}
.tag-sku-support{background:#0A1E2A;color:#60B0E0}
.tag-sku-sales{background:#1A0A2A;color:#C080F0}
.tag-sku-lifecycle{background:#0A1A0A;color:var(--accent)}
.tag-sku-suite{background:#1A1A0A;color:var(--gold)}

/* welcome hero */
.welcome-hero{padding:32px 0 24px}
.welcome-tag{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
.welcome-h1{font-size:32px;font-weight:700;line-height:1.15;margin-bottom:12px}
.welcome-h1 em{color:var(--accent);font-style:normal}
.welcome-proof{display:flex;gap:20px;margin:20px 0;flex-wrap:wrap}
.wp{font-size:13px;color:var(--text2)}.wp strong{color:var(--text)}
.welcome-note{font-size:13px;color:var(--muted);margin-top:8px}

/* print */
@media print{
  body{background:#fff;color:#111}
  .prog,.nav-row,.btn,.show-math,.no-print{display:none!important}
  .stream-math{display:block!important;background:#f5f5f5;color:#333}
  :root{--text:#111;--text2:#444;--muted:#666;--gold:#B07A00;--accent:#16A34A;--card:#f9f9f9;--border:#ddd}
  .scenario.cons{border-color:var(--accent)}
}
@media(max-width:380px){
  .opt-grid{grid-template-columns:1fr}
  .scenario-row{grid-template-columns:1fr}
  h1{font-size:22px}
  .result-hero-val{font-size:32px}
}
</style>

// ── FORMATTERS ─────────────────────────────────────────────
function fmtR(n){
  if(n===null||n===undefined||isNaN(n))return '–';
  n=Math.floor(n);
  if(n>=10000000)return '₹'+(n/10000000).toFixed(1).replace(/\.0$/,'')+'Cr';
  if(n>=100000)return '₹'+(n/100000).toFixed(1).replace(/\.0$/,'')+'L';
  return '₹'+n.toLocaleString('en-IN');
}
function fmtN(n){return Math.floor(n).toLocaleString('en-IN')}

// ── ROI ENGINE ─────────────────────────────────────────────
function calcROI(inp,sku,primaryIntent) {
  var msgs=+inp.msgs||0, aov=+inp.aov||0, conv=+inp.conv||0,
      staff=+inp.staff||1, sc=+inp.sc||20000,
      rt=inp.rt||'hours', ah=+inp.ah||20, adSpend=+inp.adSpend||0;

  var defRate = DEFLECTION[primaryIntent]||0.60;
  var lossRate = LOSS_RATE[rt]||0.42;
  var fee = SKU_INFO[sku]||SKU_INFO.support;

  // Stream 1: staff time
  var hoursPerMonth = msgs * defRate * 3.5 / 60;
  var costPerHour = (sc * staff) / 160;
  var s1 = Math.floor(hoursPerMonth * costPerHour);
  var s1Rev = Math.floor(msgs * (conv/100) * aov);
  var s1Ceil = Math.floor((sc * staff) * 0.35);
  s1 = Math.min(s1, s1Ceil);

  // Stream 2: lead recovery
  var ahMsgs = msgs * (ah/100);
  var leadsLost = Math.floor(ahMsgs * lossRate);
  var recoveredLeads = Math.floor(leadsLost * 0.50);
  var s2 = Math.floor(recoveredLeads * (conv/100) * aov);
  var s2Ceil = Math.floor(Math.max(s1Rev * 0.25, adSpend * 0.40));
  s2 = Math.min(s2, s2Ceil);

  // Stream 3: conversion lift (only for sales intents)
  var hasSalesIntent = ['qualify','support','orders','bookings','payments'].indexOf(primaryIntent)>=0;
  var s3 = 0;
  if(hasSalesIntent){
    s3 = Math.floor(msgs * 0.30 * 0.06 * aov);
    var s3Ceil = Math.floor(s1Rev * 0.15);
    s3 = Math.min(s3, s3Ceil);
  }

  // Stream 4: repeat / retention (lifecycle only)
  var hasLifecycle = primaryIntent==='lifecycle'||primaryIntent==='campaigns';
  var s4 = 0;
  if(hasLifecycle){
    s4 = Math.floor(msgs * 0.40 * 0.60 * 0.08 * aov);
    var s4Ceil = Math.floor(s1Rev * 0.30);
    s4 = Math.min(s4, s4Ceil);
  }

  var gross = s1+s2+s3+s4;

  function scenario(mult){
    var g = Math.floor(gross*mult);
    var net = g - fee.monthly;
    var paybackWks = net>0 ? Math.ceil(fee.setup/net*4.33) : 999;
    var annual = Math.floor(net*12 - fee.setup);
    var totalInvest = fee.setup + fee.monthly*12;
    var mult2 = totalInvest>0 ? Math.floor(annual/totalInvest*10)/10 : 0;
    return {gross:g,net:Math.max(0,net),paybackWks,annual:Math.max(0,annual),roiMult:Math.max(0,mult2)};
  }

  return {
    s1,s2,s3,s4,gross,fee,
    hoursPerMonth:Math.floor(hoursPerMonth),
    recoveredLeads,
    msgs,aov,conv,staff,sc,rt,ah,adSpend,defRate,lossRate,
    hasLifecycle,hasSalesIntent,
    cons:scenario(0.60),
    exp:scenario(1.00),
    opt:scenario(1.40),
    lowVolume: msgs < 100
  };
}

// ── HELPERS ────────────────────────────────────────────────
function resolveInp(){
  var d=SEG_DEF[S.seg]||SEG_DEF.d2c;
  return {
    msgs: S.inp.msgs!==undefined?S.inp.msgs:d.msgs,
    aov:  S.inp.aov!==undefined?S.inp.aov:d.aov,
    conv: S.inp.conv!==undefined?S.inp.conv:d.conv,
    staff:S.inp.staff!==undefined?S.inp.staff:d.staff,
    sc:   S.inp.sc!==undefined?S.inp.sc:d.sc,
    rt:   S.inp.rt!==undefined?S.inp.rt:d.rt,
    ah:   S.inp.ah!==undefined?S.inp.ah:d.ah,
    adSpend:S.inp.adSpend!==undefined?S.inp.adSpend:d.ad
  };
}

function getSku(){
  if(!S.primaryIntent)return 'support';
  var pi=S.primaryIntent;
  var skuMap={support:'support',qualify:'sales',lifecycle:'lifecycle',orders:'support',payments:'support',bookings:'support',campaigns:'lifecycle'};
  // if multiple intents cross SKUs, upgrade to suite
  var skus=S.intents.map(function(id){return skuMap[id]||'support'});
  var unique=[...new Set(skus)];
  if(unique.length>=3)return 'suite';
  if(unique.indexOf('lifecycle')>=0&&unique.indexOf('sales')>=0)return 'suite';
  return skuMap[pi]||'support';
}

function getSegLabel(){
  if(!S.seg)return 'your business';
  var seg=SEGMENTS.find(function(s){return s.id===S.seg});
  return seg?(seg.label+(S.sub?' — '+S.sub:'')):'your business';
}

function getSegShort(){
  if(!S.seg)return 'your segment';
  var seg=SEGMENTS.find(function(s){return s.id===S.seg});
  return seg?seg.label:'your segment';
}

function getDefaultSrc(){
  return 'typical for '+getSegShort().toLowerCase()+' at this volume';
}

  var steps=6, html='<div class="prog">';
  for(var i=0;i<steps;i++){

    html+='<div class="prog-dot '+cls+'"></div>';
  }
  return html+'</div>';
}

  '<div class="scenario-name">Expected</div>'+
  '<div class="scenario-val">'+fmtR(roi.exp.net)+'/mo</div>'+
  '<div class="scenario-sub">Payback: '+(roi.exp.paybackWks<900?roi.exp.paybackWks+' wks':'—')+'</div>'+
  '</div>'+
  '<div class="scenario">'+
  '<div class="scenario-name">Optimistic</div>'+
  '<div class="scenario-val">'+fmtR(roi.opt.net)+'/mo</div>'+
  '<div class="scenario-sub">'+fmtR(roi.opt.annual)+'/yr</div>'+

function streamRow(name,val,math){

function renderUseCases(pi,ah){
  var bank=UC_BANK[pi]||UC_BANK.support;
  var extra=UC_SEG_EXTRA[S.seg]||[];
  var all=bank.concat(extra);
  // pick 3 bot, 2 confirm, 2 escalate
  var bot=all.filter(function(u){return u.g==='bot'}).slice(0,3);
  var confirm=all.filter(function(u){return u.g==='confirm'}).slice(0,2);
  var escalate=all.filter(function(u){return u.g==='escalate'}).slice(0,2);

  function ucList(items,hdrCls,hdrTxt){
    if(!items.length)return '';
    return '<div class="uc-section">'+
    '<div class="uc-hdr '+hdrCls+'">'+hdrTxt+'</div>'+
    items.map(function(u){
      return '<div class="uc-item">'+u.t.replace('{ah}','~'+Math.round(ah))+'</div>';
    }).join('')+
    '</div>';
  }
  return ucList(bot,'bot','✓ Handled fully by the bot')+
    ucList(confirm,'confirm','⚡ Bot handles — your team confirms')+
    ucList(escalate,'escalate','👤 Escalated to your team');
}

  '<div class="close-plan">'+

// ── ACTIONS ────────────────────────────────────────────────
function go(screen){S.screen=screen;render();window.scrollTo(0,0)}

function selectSeg(id){
  S.seg=id;S.sub=null;S.inp={};
  go('q_sub');
}

function selectSub(sub){
  S.sub=sub;
  var el=document.querySelector('.opt.sel');
  document.querySelectorAll('.opt').forEach(function(o){o.classList.remove('sel')});
  var opts=document.querySelectorAll('.opt');
  opts.forEach(function(o){
    if(o.querySelector('.opt-label')&&o.querySelector('.opt-label').textContent===sub)o.classList.add('sel');
  });
  S.sub=sub;render();
}

function advanceSub(){if(S.sub)go('q_channels')}

function toggleChannel(id){
  var i=S.channels.indexOf(id);
  if(i>=0){
    S.channels.splice(i,1);
    if(S.primaryChannel===id)S.primaryChannel=S.channels[0]||null;
  } else {
    S.channels.push(id);
    if(!S.primaryChannel)S.primaryChannel=id;
  }
  render();
}
function setPrimary(id){S.primaryChannel=id;render()}
function advanceChannels(){if(S.channels.length)go('q_intent')}

function toggleIntent(id){
  var i=S.intents.indexOf(id);
  if(i>=0){
    S.intents.splice(i,1);
    if(S.primaryIntent===id)S.primaryIntent=S.intents[0]||null;
  } else {
    S.intents.push(id);
    if(!S.primaryIntent)S.primaryIntent=id;
  }
  render();
}
function setPrimaryIntent(id){S.primaryIntent=id;render()}
function advanceIntent(){if(S.intents.length)go('roi_inputs')}

function setInp(id,val){S.inp[id]=parseFloat(val)||0}
function setRt(val){S.inp.rt=val;render()}
function goResults(){S.sku=getSku();go('results')}

function toggleMath(id){
  var el=document.getElementById(id);
  if(el)el.classList.toggle('open');
  var btn=el&&el.previousSibling;
  if(btn&&btn.classList&&btn.classList.contains('show-math')){
    btn.textContent=el.classList.contains('open')?'hide the maths ↑':'show the maths ↓';
  }
}

function esc(s){return s.replace(/'/g,"\\'").replace(/"/g,'&quot;')}

// ── RENDER ─────────────────────────────────────────────────
function render(){
  var el=document.getElementById('app');
  switch(S.screen){
    case 'welcome':     el.innerHTML=renderWelcome();break;
    case 'q_segment':   el.innerHTML=renderSegment();break;
    case 'q_sub':       el.innerHTML=renderSub();break;
    case 'q_channels':  el.innerHTML=renderChannels();break;
    case 'q_intent':    el.innerHTML=renderIntent();break;
    case 'roi_inputs':  el.innerHTML=renderInputs();break;
    case 'results':     el.innerHTML=renderResults();break;
    default:            el.innerHTML=renderWelcome();
  }
}
render();
